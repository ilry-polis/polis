# ============================================================================
# Polis :: Codex custom runner declaration
# ============================================================================
# Do not write global [agents] scalar settings here. Polis may be installed into
# a config that already has user-owned multi-agent settings. Concurrency is
# bounded by Polis execution policy; the runner disables nested agents itself.

[agents.polis-task-runner]
description = "Token-efficient Polis implementation runner. Executes one coarse task or at most two closely related tasks, behavior-focused verification + atomic commits, no nested subagents."
config_file = "{POLIS_ROOT}/references/polis-task-runner.toml"
