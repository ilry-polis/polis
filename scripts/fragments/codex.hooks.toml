# ============================================================================
# Polis :: Codex hooks
# ============================================================================
# Intentionally no Polis context-monitor hooks on Codex.
#
# Codex exposes native context information in its TUI/status surfaces, including
# context remaining %, context used %, and total context-window size. Polis
# therefore does not install a PostToolUse context monitor or maintain a
# polis-ctx-* bridge for Codex.
#
# Durable workflow instructions come from AGENTS.md + Polis skills. This avoids
# per-tool hook overhead and avoids duplicating Codex's own context UI with
# Polis WARNING/HIGH/CRITICAL thresholds.
