# ============================================================================
# Polis :: Codex multi-agent guardrails
# ============================================================================
# Current Codex configuration uses [agents] for multi-agent controls and role
# declarations. Keep Polis concurrency deliberately small: write-heavy agent
# workflows trade extra tokens for isolation/parallelism, so fan-out is bounded.

[agents]
max_concurrent_threads_per_session = 2
interrupt_message = false

[agents.polis-task-runner]
description = "Token-efficient Polis implementation runner. Executes one bounded batch (1-3 related tasks), TDD + one atomic commit per task, no nested subagents."
config_file = "{POLIS_ROOT}/references/polis-task-runner.toml"
